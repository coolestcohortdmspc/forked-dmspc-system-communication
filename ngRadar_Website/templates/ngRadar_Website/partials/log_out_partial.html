{% extends 'ngRadar_Website/base.html' %}

{% block content %}
<head>
  <title>Logging You Out</title>
  <!-- The following Script prevents display of a webpage from browser cache. This needs to be in the html head to work correctly -->
   <!-- This was added specifically to fix the issue with Safari -->
    <script>
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        window.location.reload();
      }
    });
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; }
    .center { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; }
    .message {
      color: #0b1f6a; font-size: 48px; font-weight: 700;
      padding-top: 150px;
      padding-right: 250px;
    }
  </style>
</head>
<body>
  <div class="center">
    <div class="message">⏳ Logging You Out ⏳</div>
  </div>
</body>
<script>
    window.addEventListener('DOMContentLoaded', function () {
        const logoutButton = document.getElementById('theLogOut_Button');//make the logout button invisible when on this page.
        if (logoutButton) {
        logoutButton.style.visibility = 'hidden';
        }
    });
    setTimeout(function () {window.location.href = "{% url 'logout' %}";}, 1500); //return to login page after _ seconds
</script>
{% endblock %}
