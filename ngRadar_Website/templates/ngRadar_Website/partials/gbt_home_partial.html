</div>

<!--Script to disable button and change the context in button-->
<script>
    function checkLockSSE()
    {
        const eventSource = new EventSource('/home/lock-status/')
        eventSource.addEventListener('lock-status',function(event){
            try {
                const data = JSON.parse(event.data);
                const submitBTN = document.getElementById('waveform-submit-btn');

                if (data.error){
                    btn.disabled = true;
                    btn.textContent = "Error locking button";
                }
                else if(data.locked){
                    btn.disabled = true;
                    submitBTN.textContent = "Generating ..."
                }
                else{
                    submitBTN.disabled = false;
                    submitBTN.textContent = "Submit"
                }
            }
            catch (parseError)
            {
                submitBTN.disabled = true;
                submitBTN.textContent = "Error locking button";
            }
        });
        eventSource.onerror = () => {
            submitBTN.disabled = true;
            submitBTN.textContent = "Lock status unavailable";
            eventSource.close()
        }
    }
    window.addEventListener('beforeunload', function() {
        if(eventSource) eventSource.close();
    });
    checkLockSSE();
</script>
