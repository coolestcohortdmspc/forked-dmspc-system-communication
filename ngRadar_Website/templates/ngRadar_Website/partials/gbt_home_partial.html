    <div class="border rounded p-3 mb-3 bg-white d-flex align-items-center" style="min-height: 5rem;">

    </div>
      
    <!-- <div class="border rounded p-3 bg-white d-flex align-items-center" style="min-height: 5rem;">

        <p class="fs-5 mb-0"> {{ gbt_event.event_time|date:"F d Y H:i:s" }} </p>
    </div>-->
  </div> 

  <!-- Right column -->
  <div class="col-12 col-md-6 col-lg-5">
    <div class="border rounded p-3 mb-3 bg-white d-flex align-items-center" style="min-height: 5rem;">

        <p class="fs-5 mb-0"> {{ gbt_event.rec_waveform }} </p>
    </div>
  </div>
</div>

<!--Script to disable button and change the context in button-->
<script>
    function checkLockSSE()
    {
        const eventSource = new EventSource('/home/lock-status/')
        eventSource.addEventListener('lock-status',function(event){
            const data = JSON.parse(event.data);
            const submitBTN = document.getElementById('waveform-submit-btn');
            submitBTN.disabled = data.locked;
            if (data.locked){
                submitBTN.textContent = "Generating ..."
            }
            else{
                submitBTN.textContent = "Submit"
            }
        });
        eventSource.onerror = () => {
            eventSource.close()
        }
    }
    window.addEventListener('beforeunload',() => {
        if(eventSource) eventSource.close();
    });
    checkLockSSE();
</script>
