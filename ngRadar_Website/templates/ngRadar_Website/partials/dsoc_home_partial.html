<div class="mt-4 border rounded pt-3 pb-3 bg-white ps-3 pe-3 text-center mx-auto"
style="max-width: 50rem;">
    {% if latest_event.image_key %}
        <h5 class="fw-bold">DDM last updated at {{ latest_event.event_time|date:"F d Y H:i:s" }}</h5>
        <img id="new-ddm-image" 
             src="{% url 'serve_image' latest_event.uuid %}" 
             alt="DDM generated by DSOC" 
             class="img-fluid" 
             style="display:none;">
        <div id="image-loading" class="text-muted p-5">Loading latest image...</div>
    {% else %}
        <h5 class="fw-bold">Waiting for DDM to be created...</h5>
        <p class="text-muted mt-5">No image available yet</p>
    {% endif %}
</div>


<!-- This js is to allow cross-origin requests (CORS) to seaweedfs -->
<script>
(function() {
    const imgElement = document.getElementById("new-ddm-image");
    const loadingElement = document.getElementById("image-loading");
    
    if (imgElement) {
        // Unhide the image block only after it fully fetches from SeaweedFS
        imgElement.onload = function() {
            imgElement.style.display = "block";
            loadingElement.style.display = "none";
        };
        
        // Error handling:
        imgElement.onerror = function() {
            loadingElement.innerText = "Could not retrieve image from SeaweedFS.";
        };
        
        if (imgElement.complete) {
            imgElement.onload();
        }
    }
})();
</script>
