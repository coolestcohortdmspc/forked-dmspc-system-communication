# ===========================================================================
# We use 1 Dockerfile and 1 docker-compose.yml file to build and 
# run the Django application in a containerized environment.
# Currently only configured to work across droplets. Will not work correctly fully local.
# ===========================================================================


#==========================
# UI + DB containers:
#==========================

services:

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data


  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
     # Connect to the 'traefik_proxy' overlay network for inter-container communication across nodes
      - proxy

    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt
      # - ./certs:/certs:ro
      # - ./dynamic:/dynamic:ro

    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Optional redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # - "--entrypoints.websecure.http.tls=true"

      # # Attach the static configuration tls.yaml file that contains the tls configuration settings
      # - "--providers.file.filename=/dynamic/tls.yml"

      # Docker providers 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"

      # Let's Encrypt / ACME
      - "--certificatesresolvers.le.acme.email=coolestcohortdmspc@gmail.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
       # STAGING CA while testing - delete when done 
      - "--certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      
      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=true"

      # Observability 
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"

  # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"


  ngradar_website:
    container_name: ngradar_website
    build:
      context: .
      target: app
    env_file:
      - .env
    depends_on:
      postgres:
          condition: service_healthy
    volumes:
      - .:/service
    # ports:
    #   - 8000:8000
    networks:
      - ngradar_website_network
      - proxy
    labels:
      - "traefik.enable=true"

      # Telling Traefik which Docker network to use
      - "traefik.docker.network=proxy"

      # Tells Traefik to route public requests matching your domain/IP to this container
      - "traefik.http.routers.ngradar_website.rule=Host(`${SITE_DOMAIN}`) || Host(`${WEBSITE_DOMAIN}`)"
      - "traefik.http.routers.ngradar_website.entrypoints=websecure"
      - "traefik.http.routers.ngradar_website.service=ngradar_website"
      - "traefik.http.routers.ngradar_website.tls=true"
      - "traefik.http.routers.ngradar_website.tls.certresolver=le"
      # Pin the cert name: without this Traefik would also try to certify the
      # bare IP from the rule above, which ACME can never issue.
      - "traefik.http.routers.ngradar_website.tls.domains[0].main=${SITE_DOMAIN}"



      # Optional: Explicitly tell Traefik which port your web app container listens on internally
      - "traefik.http.services.ngradar_website.loadbalancer.server.port=8000"
    stdin_open: true
    tty: true
    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000


  postgres:
    container_name: postgres
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - ${WEBSITE_DOMAIN}:5432:5432
    environment:
      - POSTGRES_USER=ngradar_website # Use env variables instead of exposing these!!!!
      - POSTGRES_PASSWORD=ngradar_website
      - POSTGRES_DB=localdev
    networks:
      - ngradar_website_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngradar_website -d localdev"]
      interval: 5s
      timeout: 5s
      retries: 5

  staging_loader:
    container_name: staging_loader
    build:
      context: .
      target: load-staging-data
    env_file:
      - .env
    networks:
      - ngradar_website_network
    depends_on:
      - postgres
    volumes:
      - staging_dump:/dump
    profiles:
      - tools

#==========================
# kafka related containers:
#==========================

  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.5.1
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ngradar_website_network



# A one-shot init service that creates the Kafka topics after the broker is healthy
  kafka-init:
    container_name: kafka-init
    image: confluentinc/cp-kafka:7.5.1
    depends_on:
      kafka-broker:
        condition: service_healthy
    profiles: ["kafka"]
    networks:
      - ngradar_website_network
    entrypoint:
    - /bin/sh
    - -ec
    - |
      echo "Creating Kafka topics..."

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic user_input \
        --partitions 3 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic GBT_data \
        --partitions 1 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic VLBA_notif \
        --partitions 1 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic DSOC_notif \
        --partitions 1 \
        --replication-factor 1

      echo "Kafka topic initialization complete."
    restart: "no"


  # ngrok:
  #   container_name: ngrok
  #   image: ngrok/ngrok:latest
  #   profiles: ["kafka"]
  #   env_file:
  #     - .env
  #   environment:
  #     NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
  #   depends_on:
  #     kafka-broker:
  #       condition: service_healthy
  #     seaweedfs:
  #       condition: service_started
  #   volumes:
  #     - ./ngrok.yml:/etc/ngrok.yml:ro
  #   command:
  #     - start
  #     - --all
  #     - --config
  #     - /etc/ngrok.yml
  #   networks:
  #     - ngradar_website_network
    

  kafka-broker:
    container_name: kafka-broker
    user: "0:0"
    image: confluentinc/cp-kafka:7.5.1
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    ports:
      - ${WEBSITE_DOMAIN}:9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker:29092,EXTERNAL://${WEBSITE_DOMAIN}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - ngradar_website_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server kafka-broker:29092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    profiles: ["kafka"]
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
    depends_on:
      - kafka-broker
    networks:
      - ngradar_website_network




#==========================
# sim containers:
#==========================

  gbt:
    container_name: gbt
    build:
      context: .
      target: base
    env_file:
      - .env
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   kafka-broker:
    #     condition: service_healthy
    #   kafka-init:
    #     condition: service_completed_successfully
    volumes:
      - .:/service
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      BOOTSTRAP_SERVER: ${WEBSITE_DOMAIN}:9092
      # if we move this sim to a separate machine, use the below bootstrap server:
      # BOOTSTRAP_SERVER=7.tcp.ngrok.io:26729
    entrypoint:
        - python
        - manage.py
        - gbt_sim



  dsoc:
    container_name: dsoc
    build:
      context: .
      target: base
    env_file:
      - .env
    depends_on:
      dsoc-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    volumes:
      - .:/service
      - dsoc_transfer:/dsoc/incoming 
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      BOOTSTRAP_SERVER: kafka-broker:29092
      # if we move this sim to a separate machine, use the below bootstrap server:
      # BOOTSTRAP_SERVER=7.tcp.ngrok.io:26729
    entrypoint:
        - python
        - manage.py
        - dsoc_sim
  

  

  vlba:
    container_name: vlba
    build:
      context: .
      target: etc
    env_file:
      - .env
    # depends_on:
      # postgres:
      #   condition: service_healthy
      # kafka-broker:
      #   condition: service_healthy
      # kafka-init:
      #   condition: service_completed_successfully
      # etr_daemon:
      #   condition: service_started
    volumes:
      - .:/service
      - vlba_data:/raw_data
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      ETD_DESTINATION: "etr_daemon:/dsoc/incoming/" # NO LONGER SHARED VOLUME - GET RID OF THIS WHEN WE FIGURE OUT HOW TO DO E-TRANSFER OVER PUBLIC INTERNET
      BOOTSTRAP_SERVER: ${WEBSITE_DOMAIN}:9092
      # if we move this sim to a separate machine, use the below bootstrap server:
      # BOOTSTRAP_SERVER=7.tcp.ngrok.io:26729
    entrypoint:
      - python
      - manage.py
      - vlba_sim



#==========================
# storage containers:
#==========================
  seaweedfs:
    container_name: seaweedfs
    build: 
      context: .
      target: seaweedfs
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WEED_S3_ACCESS_KEY: ${WEED_S3_ACCESS_KEY}
      WEED_S3_SECRET_KEY: ${WEED_S3_SECRET_KEY}
    ports:
      - "8333:8333" # SeaweedFS S3 gateway (ngrok exposes this during demos for our cloud-hosted website to retrieve images)
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweed_data:/data
    depends_on:
      - postgres
    networks:
      - ngradar_website_network
    profiles: ["kafka"]



