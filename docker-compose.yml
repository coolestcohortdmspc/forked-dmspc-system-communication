#==========================
# etransfer containers:
#==========================
# a one-shot init service that creates the volume before etd starts
  dsoc-volume-init:
    container_name: dsoc-volume-init
    image: alpine:3.20
    profiles: ["kafka"]
    user: "0:0"
    volumes:
      - dsoc_transfer:/dsoc/incoming
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /dsoc/incoming
        chown -R 33:33 /dsoc/incoming
        chmod 775 /dsoc/incoming

  etr_daemon:
    container_name: etr_daemon
    build:
      context: .
      target: etd
    profiles: ["kafka"]
    user: "33:33"   # non root user: www-data
    ports:
      - "${WEBSITE_DOMAIN}:4004:4004/tcp"
      - "${WEBSITE_DOMAIN}:8008:8008/udp"
    depends_on:
      dsoc-volume-init:
        condition: service_completed_successfully
    networks:
      - ngradar_website_network
    volumes:
      - dsoc_transfer:/dsoc/incoming
    command:
      - etd
      - -f
      - --command
      - tcp://:4004
      - --data
      - srt://:8008



#==========================
# end of containers
#==========================


volumes:
  postgres_data:
  staging_dump:
  seaweed_data:
  dsoc_transfer:
  vlba_data:
  portainer_data:

networks:
  ngradar_website_network:
    driver: bridge
  proxy:
    name: proxy
    driver: bridge
    external: true