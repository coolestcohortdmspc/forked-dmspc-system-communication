global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "traefik"
    static_configs:
      - targets:
          - "traefik-metrics:8082"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres_exporter:9187"

  # Kafka cluster-level metrics:
  # topics, partitions, consumer groups, offsets, lag, broker count
  - job_name: "kafka-exporter"
    static_configs:
      - targets:
          - "kafka-exporter:9308"

  # Kafka broker-level JMX metrics:
  # throughput, replication, controller and JVM/broker health
  - job_name: "kafka-jmx"
    static_configs:
      - targets:
          - "kafka-node-1:7071"
          - "kafka-node-2:7071"
          - "kafka-node-3:7071"