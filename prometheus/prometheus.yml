global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "traefik"
    static_configs:
      - targets:
          - "traefik-metrics:8082"  # allow prometheus to scrape website

  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres_exporter:9187"  # allow prometheus to scrape postgres 

  - job_name: "kafka"
    static_configs:
      - targets:
            - "kafka-node-1:7071"   # allow prometheus to scrape kafka metrics such as topics / partitions / consumer groups / lag
            - "kafka-node-2:7071"
            - "kafka-node-3:7071"